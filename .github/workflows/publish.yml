name: Publish to npm

# Release-only: publish runs on version tags (v*) or an explicit manual run.
# It never runs on branch pushes or PRs.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify release tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node --print "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $package_version (expected v$package_version)."
            exit 1
          fi

      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@11.21.2
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # OIDC-based npm provenance (trusted publishing). No NPM_TOKEN required:
      # the npm registry verifies the GitHub Actions OIDC token against the
      # trusted publisher configured on npmjs.com for this package. The trusted
      # publisher must explicitly allow direct `npm publish` as an allowed action.
      - name: Publish to npm
        run: npm publish --provenance --access public
