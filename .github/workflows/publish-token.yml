name: Publish to npm (bootstrap token)

# Bootstrap / fallback release path.
#
# Why this exists: npm Trusted Publishing can only be attached to a package
# that already exists on the registry, so the very first publish of a brand-new
# package cannot go through OIDC — a package that has no settings page cannot
# have a trusted publisher configured. This workflow publishes with a granular
# npm access token (secret NPM_TOKEN, "Bypass 2FA" required) instead.
#
# Run it manually after bumping the version in package.json. Once the package
# exists and a trusted publisher is configured, the tag-driven OIDC workflow
# (publish.yml) takes over and this one is only a fallback.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-token
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify the token secret is present
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "::error::Repository secret NPM_TOKEN is missing. Create a granular npm access token with Bypass 2FA and store it as NPM_TOKEN."
            exit 1
          fi

      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@11.21.2
          npm --version

      - name: Show target version
        shell: bash
        run: |
          echo "package: $(node -p "require('./package.json').name")"
          echo "version: $(node -p "require('./package.json').version")"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
